[budgets]
sheets_per_workbook = 10
sections_per_sheet = 5
distinct_formula_shapes = 40
formula_depth = 4
function_calls_per_cell = 2
live_drivers = 6

[rules.XL002]
allowed_literals = [0, 1, -1, 12, 100]

# The ROUND / VLOOKUP / HLOOKUP / INDEX / OFFSET positional exemptions that
# used to sit here are built into the rule as of 2026-09-22. They are a
# property of Excel's function grammar rather than of this project, so they
# need no waiver. Exempting a position beyond that set does need one.

[waivers]
entries = []
